<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emergency Options</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 28px;
    }
    .button {
      background: #1f1f1f;
      border: 2px solid #444;
      border-radius: 12px;
      padding: 15px 25px;
      font-size: 18px;
      color: #fff;
      margin: 10px;
      width: 220px;
      text-align: center;
      text-decoration: none;
      transition: 0.3s;
    }
    .button:hover {
      background: #333;
    }
    .fire { border-color: #e74c3c; }
    .medical { border-color: #3498db; }
    .police { border-color: #2ecc71; }
  </style>
</head>
<body>
  <h1>🚨 Emergency Services</h1>
  <a href="tel:101" class="button fire">🔥 Fire Support</a>
  <a href="tel:102" class="button medical">🩺 Medical Support</a>
  <a href="tel:100" class="button police">👮 Police Support</a>
</body>
</html>
